services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inferno
      POSTGRES_PASSWORD: inferno
      POSTGRES_DB: inferno
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inferno -d inferno"]
      interval: 2s
      timeout: 3s
      retries: 15
